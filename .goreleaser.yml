version: 2

project_name: Compress

before:
  hooks:
    - go mod tidy

builds:
  - id: compress
    binary: Compress

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    env:
      - CGO_ENABLED=0

archives:
  - id: archives

    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages

    package_name: compress

    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Arch }}

    homepage: https://github.com/YOUR_USERNAME/Compress
    maintainer: YOUR NAME <you@example.com>
    description: Command-line image converter and compressor.
    license: MIT

    bindir: /usr/bin

    formats:
      - deb
      - rpm

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github